name: arbbot

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arbbot
      POSTGRES_PASSWORD: arbbot
      POSTGRES_DB: arbbot
    ports:
      # Published on 55432, well clear of the 5432/5433 range that local
      # PostgreSQL installs claim. When a host server already holds the port,
      # the published mapping is shadowed and connections land on the wrong
      # server -- which surfaces as a password failure rather than a refused
      # connection, and costs an hour to diagnose. Override with ARBBOT_DB_PORT.
      - "${ARBBOT_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app waits for this rather than sleeping: a collector that starts
      # before the database is accepting connections drops its first messages,
      # and a gap in the raw archive is not recoverable after the fact.
      test: ["CMD-SHELL", "pg_isready -U arbbot -d arbbot"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ARBBOT_ENVIRONMENT: local
      ARBBOT_DATABASE_URL: postgresql+psycopg://arbbot:arbbot@db:5432/arbbot
      ARBBOT_LOG_LEVEL: INFO
    # No venue credentials are passed. Local and research deployments use
    # public endpoints only, and the config layer rejects a credential in
    # those environments (see arbbot.config).
    command: ["arbbot", "doctor"]
    volumes:
      - ./src:/app/src:ro
      - ./alembic:/app/alembic:ro

  # The seven-day collection run. Started explicitly:
  #     docker compose --profile collect up -d
  # It is behind a profile so that an ordinary `docker compose up` for
  # development does not quietly start collecting against the live venue.
  collector:
    build:
      context: .
    profiles: ["collect"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ARBBOT_ENVIRONMENT: research
      ARBBOT_DATABASE_URL: postgresql+psycopg://arbbot:arbbot@db:5432/arbbot
      ARBBOT_LOG_LEVEL: INFO
    # No credentials, by design and by enforcement: the config layer rejects
    # one in the research environment (threat T1).
    command: ["collect", "--universe", "--interval", "30"]
    # The exit gate is seven days of *continuous* collection, and a bare
    # process that dies at 3am leaves a hole that cannot be backfilled -- the
    # venue does not re-send what nobody asked for. Restarting is safe because
    # the collector resumes each stream's sequence from the archive.
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
