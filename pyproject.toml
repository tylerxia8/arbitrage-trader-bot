[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arbbot"
version = "0.1.0"
description = "Logical-arbitrage evidence and execution platform for event contracts"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Tyler Xia" }]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "pytest-asyncio>=0.23,<1",
    "hypothesis>=6.100,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
arbbot = "arbbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arbbot"]

# ---------------------------------------------------------------------------
# Money path (FR-002)
#
# Modules listed here may not contain binary floating point. Enforced by
# tools/check_no_float.py in CI and by tests/test_no_float_in_money_path.py.
# Roots that do not exist yet are declared deliberately: the rule then applies
# to the first commit that creates them, rather than being remembered later.
# ---------------------------------------------------------------------------
[tool.arbbot]
money_path_roots = [
    "src/arbbot/money.py",
    "src/arbbot/config.py",
    "src/arbbot/db/base.py",
    "src/arbbot/marketdata",  # prices and sizes are integers; keep them that way
    "src/arbbot/fees",        # M2
    "src/arbbot/economics",   # M2
    "src/arbbot/detector",    # M2
    "src/arbbot/ledger",      # M3
    "src/arbbot/execution",   # M4
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "S",         # bandit (security)
    "DTZ",       # naive-datetime bans -- all timestamps must be tz-aware
    "PT",        # pytest style
    "ANN",       # require annotations (mypy strict depends on these)
]
ignore = [
    "ANN401",  # allow typing.Any where genuinely needed
    "E501",    # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "tools"]
mypy_path = "tools"

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
    "integration: requires a live database or network access",
]

[tool.coverage.run]
source = ["src/arbbot"]
branch = true

[tool.coverage.report]
show_missing = true
